<text x="112" y="1111" fill="#c8101e" font-size="10" font-weight="bold" letter-spacing="2">SIMPLES ASSIM</text><text x="112" y="1172" font-family="Georgia,serif" font-size="46">Da descoberta</text><text x="112" y="1222" font-family="Georgia,serif" font-size="46">à boa escolha.</text><text x="112" y="1262" fill="#77736e" font-size="13">Entre para acompanhar as oportunidades</text><text x="112" y="1283" fill="#77736e" font-size="13">e decidir com informação.</text><rect x="112" y="1310" width="236" height="49" rx="5" fill="#c8101e"/><text x="130" y="1340" fill="white" font-size="12" font-weight="bold">◉  Acessar grupo de ofertas →</text>
