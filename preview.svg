<text x="135" y="851" fill="#c8101e" font-size="10" font-weight="bold">01</text><text x="458" y="851" fill="#c8101e" font-size="20">♡</text><text x="135" y="901" font-size="17" font-weight="bold">Moda &amp; autocuidado</text><text x="135" y="929" fill="#77736e" font-size="12">Achadinhos para o dia a dia e para cuidar de você.</text><path d="M135 958h29" stroke="#c8101e" stroke-width="2"/>
