<text x="112" y="416" fill="#77736e" font-size="17">A gente garimpa oportunidades para você encontrar produtos</text><text x="112" y="444" fill="#77736e" font-size="17">que valem a pena — sem perder tempo no meio de tanta oferta.</text>
