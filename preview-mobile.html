<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090b">
<title>APEX — Prévia mobile</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08090b;color:#f4f2ef;font-family:Inter,system-ui,Segoe UI,sans-serif}.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px}.label{display:flex;align-items:center;gap:10px;color:#aeb3bc;font-size:12px}.label b{color:#ff3b3b;font:700 10px ui-monospace,monospace;letter-spacing:.12em}.device{width:410px;height:min(866px,calc(100vh - 62px));min-height:620px;padding:10px;position:relative;border:1px solid #353943;border-radius:38px;background:#030405;box-shadow:0 30px 90px #000b,0 0 0 1px #161920}.screen{width:100%;height:100%;overflow:hidden;border-radius:28px;background:#0a0b0e}.screen iframe{display:block;width:100%;height:100%;border:0;background:#0a0b0e}.hint{color:#777d87;font-size:10px;text-align:center}.device:before{content:"";position:absolute;z-index:2;top:14px;left:50%;width:74px;height:16px;transform:translateX(-50%);border-radius:12px;background:#030405;pointer-events:none;opacity:.9}@media(max-width:600px){.stage{display:block;min-height:100dvh;padding:0}.label,.hint,.device:before{display:none}.device{width:100vw;height:100dvh;min-height:0;padding:0;border:0;border-radius:0;box-shadow:none;background:#0a0b0e}.screen{border-radius:0}.screen iframe{width:100vw;height:100dvh}}
</style>
</head>
<body>
<main class="stage">
  <div class="label"><b>APEX / MOBILE PREVIEW</b><span>Visualização em formato de telefone · 390 px</span></div>
  <div class="device"><div class="screen"><iframe src="preview.html#inicio" title="Prévia mobile do APEX Clube de Ofertas"></iframe></div></div>
  <div class="hint">Role na tela para percorrer a página; os departamentos, o modo claro/escuro e o FAQ são interativos.</div>
</main>
</body>
</html>
